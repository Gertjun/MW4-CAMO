name: Tests

on:
  push:
    branches: [main, "stability/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests uitvoeren
        run: npm test
      - name: PWA-Core release-pin valideren
        run: node tools/pin.mjs verify
      - name: PWA-Core service-worker-precache valideren
        run: node tools/precache.mjs
