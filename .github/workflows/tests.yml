name: Tests

on:
  push:
    branches: [main, "stability/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js instellen
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests uitvoeren
        run: npm test
      - name: PWA-Core release-pin valideren
        run: node tools/pin.mjs verify
      - name: PWA-Core service-worker-precache valideren
        run: node tools/precache.mjs
