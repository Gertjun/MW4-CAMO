name: Tests

on:
  push:
    branches: [main, "stability/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node.js instellen
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tests uitvoeren
        run: npm test
      - name: PWA-Core release-pin valideren
        run: node tools/pin.mjs verify
      - name: PWA-Core service-worker-precache valideren
        run: node tools/precache.mjs
